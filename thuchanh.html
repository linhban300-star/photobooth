<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành HTML & CSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --secondary: #FF6584;
            --success: #00D2A0;
            --warning: #FFB347;
            --danger: #FF6B6B;
            --bg: #F0F2F5;
            --bg-card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --shadow: 0 4px 24px rgba(108,99,255,0.10);
            --shadow-hover: 0 8px 40px rgba(108,99,255,0.18);
            --radius: 14px;
            --radius-sm: 8px;
            --header-h: 64px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="dark"] {
            --bg: #0D1117;
            --bg-card: #161B22;
            --text: #F0F6FC;
            --text-secondary: #8B949E;
            --border: #30363D;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.6);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            line-height: 1.6;
            min-height: 100vh;
        }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; background: none; }
        textarea { font-family: 'Consolas', 'Courier New', monospace; outline: none; border: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,99,255,0.35); }
        .btn-outline { background: transparent; color: var(--primary); border-color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { opacity: 0.85; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.85; transform: translateY(-2px); }
        .btn-sm { padding: 6px 14px; font-size: 13px; }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background: rgba(0,210,160,0.15); color: var(--success); }
        .badge-primary { background: rgba(108,99,255,0.15); color: var(--primary); }
        .badge-warning { background: rgba(255,179,71,0.15); color: var(--warning); }
        .badge-danger { background: rgba(255,107,107,0.15); color: var(--danger); }
        .badge-easy { background: rgba(0,210,160,0.15); color: var(--success); }
        .badge-medium { background: rgba(255,179,71,0.15); color: var(--warning); }
        .badge-hard { background: rgba(255,107,107,0.15); color: var(--danger); }

        .toast-container {
            position: fixed;
            top: 76px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text);
            box-shadow: var(--shadow-hover);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }
        .toast-warning { border-left-color: var(--warning); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .header-brand i { font-size: 26px; }
        .header-brand span { color: var(--text); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .header-actions .btn-icon:hover { background: var(--border); color: var(--text); }
        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: var(--bg);
            transition: var(--transition);
        }
        .header-user:hover { background: var(--border); }
        .header-user .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
        }
        .header-user .name {
            font-size: 14px;
            font-weight: 500;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .menu-btn { display: none; font-size: 24px; color: var(--text); padding: 4px; }
        @media (max-width: 1024px) { .menu-btn { display: block; } }

        .main {
            margin-top: var(--header-h);
            min-height: calc(100vh - var(--header-h));
            padding: 28px 32px;
            transition: margin var(--transition);
        }
        @media (max-width: 1024px) { .main { padding: 20px 16px; } }
        @media (max-width: 600px) { .main { padding: 14px 12px; } }

        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 26px; font-weight: 700; }
        .page-header p { color: var(--text-secondary); font-size: 15px; margin-top: 2px; }

        .practice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 500px;
        }
        @media (max-width: 900px) {
            .practice-grid { grid-template-columns: 1fr; }
        }

        .editor-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .editor-box .head {
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-box textarea {
            width: 100%;
            height: 340px;
            padding: 14px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 14px;
            resize: vertical;
            line-height: 1.8;
            tab-size: 2;
            border: none;
        }
        .editor-box textarea:focus { outline: none; }
        .editor-box textarea::placeholder { color: var(--text-secondary); }

        .preview-box {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            min-height: 500px;
        }
        .preview-box .head {
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
        }
        .preview-box iframe {
            width: 100%;
            height: 460px;
            border: none;
            background: #fff;
        }
        @media (max-width: 900px) {
            .preview-box iframe { height: 320px; }
            .editor-box textarea { height: 200px; }
        }

        .practice-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .practice-item {
            background: var(--bg);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
            min-width: 180px;
        }
        .practice-item .level {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .level-easy { background: rgba(0,210,160,0.15); color: var(--success); }
        .level-medium { background: rgba(255,179,71,0.15); color: var(--warning); }
        .level-hard { background: rgba(255,107,107,0.15); color: var(--danger); }

        .shortcut-hint {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .shortcut-hint kbd {
            background: var(--border);
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
        }

        .back-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-hover);
            transition: var(--transition);
            z-index: 997;
        }
        .back-top:hover { transform: translateY(-3px); background: var(--primary-dark); }
        .back-top.visible { display: flex; }

        /* AI Chat */
        .ai-chat-toggle {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-size: 24px;
            box-shadow: var(--shadow-hover);
            z-index: 996;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        .ai-chat-toggle:hover { transform: scale(1.1); }
        .ai-chat-panel {
            position: fixed;
            bottom: 170px;
            right: 30px;
            width: 380px;
            max-height: 500px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-hover);
            z-index: 996;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .ai-chat-panel.open { display: flex; }
        .ai-chat-panel .header {
            padding: 14px 18px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: static;
            height: auto;
            border-bottom: none;
        }
        .ai-chat-panel .header button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .ai-chat-panel .messages {
            flex: 1;
            padding: 14px 18px;
            overflow-y: auto;
            max-height: 340px;
        }
        .ai-chat-panel .messages .msg {
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            max-width: 85%;
        }
        .ai-chat-panel .messages .msg.user {
            background: var(--primary);
            color: #fff;
            margin-left: auto;
        }
        .ai-chat-panel .messages .msg.ai {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .ai-chat-panel .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .ai-chat-panel .input-area input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        .ai-chat-panel .input-area input:focus { border-color: var(--primary); }
        .ai-chat-panel .input-area button {
            padding: 8px 16px;
            background: var(--primary);
            color: #fff;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .ai-chat-panel .input-area button:hover { background: var(--primary-dark); }

        @media (max-width: 768px) {
            .ai-chat-panel { width: calc(100% - 40px); right: 20px; bottom: 160px; max-height: 400px; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- AI Chat -->
    <button class="ai-chat-toggle" onclick="toggleAIChat()" title="Hỏi đáp với AI">
        <i class="fas fa-robot"></i>
    </button>
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="header">
            <span><i class="fas fa-robot"></i> AI Tutor</span>
            <button onclick="toggleAIChat()"><i class="fas fa-times"></i></button>
        </div>
        <div class="messages" id="aiMessages">
            <div class="msg ai">Xin chào! Tôi là AI Tutor. Hãy hỏi tôi bất kỳ câu hỏi nào về HTML, CSS, hoặc bài thực hành của bạn.</div>
        </div>
        <div class="input-area">
            <input type="text" id="aiInput" placeholder="Nhập câu hỏi..." onkeypress="if(event.key==='Enter') sendAIMessage()">
            <button onclick="sendAIMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <header class="header">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="header-brand">
                <i class="fas fa-code"></i>
                <span>Thực hành HTML+CSS</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleTheme()" title="Chuyển theme">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <div id="headerUser">
                <div class="header-user">
                    <div class="avatar" id="userAvatar">H</div>
                    <span class="name" id="userName">Học viên</span>
                </div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="goToLearning()"><i class="fas fa-book"></i> Học tập</button>
            <button class="btn btn-outline btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </header>

    <main class="main">
        <div class="page-header">
            <h1>💻 Thực hành code</h1>
            <p id="practiceTitle">Chọn bài tập bên dưới để bắt đầu</p>
        </div>

        <div id="practiceExercises" style="margin-bottom:16px;"></div>

        <div class="practice-grid">
            <div>
                <div class="editor-box">
                    <div class="head"><span>📄 HTML</span> <span style="font-weight:400;font-size:12px;color:var(--text-secondary);">Ctrl+Enter để chạy</span></div>
                    <textarea id="htmlEditor" spellcheck="false" placeholder="<!-- Viết HTML của bạn ở đây -->"></textarea>
                </div>
                <div class="editor-box mt-16">
                    <div class="head"><span>🎨 CSS</span></div>
                    <textarea id="cssEditor" spellcheck="false" placeholder="/* Viết CSS của bạn ở đây */"></textarea>
                </div>
            </div>
            <div>
                <div class="preview-box">
                    <div class="head">🔍 Preview</div>
                    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
                    <button class="btn btn-primary btn-sm" onclick="runCode()"><i class="fas fa-play"></i> Chạy</button>
                    <button class="btn btn-outline btn-sm" onclick="resetPractice()"><i class="fas fa-undo"></i> Reset</button>
                    <button class="btn btn-success btn-sm" onclick="submitPractice()"><i class="fas fa-check"></i> Nộp bài</button>
                    <button class="btn btn-danger btn-sm" onclick="clearPractice()"><i class="fas fa-trash"></i> Xóa</button>
                </div>
                <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
                    <span class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> Chạy code</span>
                    <span class="shortcut-hint"><i class="fas fa-save"></i> Tự động lưu</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ============================================================
        // DATA
        // ============================================================
        const LESSONS = [{
            day: 1,
            practices: [
                { title: 'Tạo trang HTML cơ bản', desc: 'Tạo trang HTML với đầy đủ cấu trúc và ít nhất 3 thẻ heading khác nhau.', level: 'Dễ' },
                { title: 'Trang giới thiệu', desc: 'Tạo trang giới thiệu về bản thân với tiêu đề, đoạn văn và comment.', level: 'Dễ' },
                { title: 'Trang chủ đơn giản', desc: 'Tạo trang chủ với tiêu đề chính, tiêu đề phụ và ít nhất 4 đoạn văn.', level: 'Trung bình' },
                { title: 'Trang báo tường', desc: 'Tạo trang báo tường với nhiều heading và paragraph.', level: 'Trung bình' },
                { title: 'Trang giới thiệu sản phẩm', desc: 'Tạo trang giới thiệu sản phẩm với cấu trúc HTML hoàn chỉnh.', level: 'Khó' }
            ]
        }, {
            day: 2,
            practices: [
                { title: 'Trang văn bản định dạng', desc: 'Tạo trang với các thẻ định dạng văn bản: strong, em, mark, br, hr.', level: 'Dễ' },
                { title: 'Trang liên kết', desc: 'Tạo trang với ít nhất 5 liên kết khác nhau.', level: 'Dễ' },
                { title: 'Trang giới thiệu với liên kết', desc: 'Tạo trang giới thiệu bản thân với các liên kết đến trang khác.', level: 'Trung bình' },
                { title: 'Trang chủ với navigation', desc: 'Tạo trang chủ với thanh điều hướng (nav) chứa ít nhất 4 liên kết.', level: 'Trung bình' },
                { title: 'Trang tài liệu tham khảo', desc: 'Tạo trang tài liệu với nhiều liên kết tham khảo.', level: 'Khó' }
            ]
        }, {
            day: 3,
            practices: [
                { title: 'Trang hình ảnh', desc: 'Tạo trang chèn ít nhất 3 hình ảnh với đầy đủ alt và kích thước.', level: 'Dễ' },
                { title: 'Trang danh sách', desc: 'Tạo trang với ul, ol và danh sách lồng nhau ít nhất 2 cấp.', level: 'Dễ' },
                { title: 'Trang giới thiệu với ảnh và danh sách', desc: 'Kết hợp ảnh và nhiều loại danh sách trong một trang.', level: 'Trung bình' },
                { title: 'Trang menu website', desc: 'Tạo menu điều hướng bằng danh sách lồng nhau (ul trong li).', level: 'Khó' },
                { title: 'Trang album ảnh', desc: 'Tạo album ảnh với nhiều hình ảnh và chú thích.', level: 'Khó' }
            ]
        }, {
            day: 4,
            practices: [
                { title: 'Bảng đơn giản', desc: 'Tạo bảng với ít nhất 4 cột và 5 hàng dữ liệu.', level: 'Dễ' },
                { title: 'Form đăng ký', desc: 'Tạo form với các trường: tên, email, password, giới tính (radio).', level: 'Dễ' },
                { title: 'Form đăng ký đầy đủ', desc: 'Tạo form với: tên, email, password, giới tính, sở thích (checkbox), lớp (select), ghi chú (textarea).', level: 'Trung bình' },
                { title: 'Trang bảng và form', desc: 'Kết hợp bảng và form trong một trang hoàn chỉnh.', level: 'Trung bình' },
                { title: 'Form khảo sát', desc: 'Tạo form khảo sát ý kiến với nhiều loại input.', level: 'Khó' }
            ]
        }, {
            day: 5,
            practices: [
                { title: 'Cấu trúc trang đơn', desc: 'Tạo trang với header, main, footer cơ bản.', level: 'Dễ' },
                { title: 'Trang blog', desc: 'Tạo trang blog với header, nav, main (section + article), aside, footer.', level: 'Dễ' },
                { title: 'Trang giới thiệu sản phẩm', desc: 'Tạo trang với cấu trúc semantic đầy đủ và div/span.', level: 'Trung bình' },
                { title: 'Trang portfolio', desc: 'Tạo trang portfolio cá nhân với cấu trúc semantic chuyên nghiệp.', level: 'Khó' },
                { title: 'Trang tin tức', desc: 'Tạo trang tin tức với nhiều article và section.', level: 'Khó' }
            ]

            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            t.className = `toast toast-${type}`;
            t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(60px)'; setTimeout(() => t.remove(), 400); }, 3000);
        }

        function renderPracticeExercises() {
            const l = LESSONS.find(x => x.day === currentDay);
            if (!l || !l.practices) {
                document.getElementById('practiceExercises').innerHTML = '';
                return;
            }
            const container = document.getElementById('practiceExercises');
            const levelClass = { 'Dễ': 'level-easy', 'Trung bình': 'level-medium', 'Khó': 'level-hard' };
            container.innerHTML = `
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;">
              <span style="font-weight:600;font-size:15px;margin-right:4px;">📋 Ngày ${currentDay}:</span>
              ${l.practices.map((p, idx) => `
                <button class="btn ${idx === currentPracticeIndex ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="selectPractice(${idx})">
                  <span class="level ${levelClass[p.level] || 'level-easy'}">${p.level}</span>
                  ${p.title}
                </button>
              `).join('')}
            </div>
            <div style="background:var(--bg);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:12px;border-left:4px solid var(--primary);">
              <strong>${l.practices[currentPracticeIndex]?.title || ''}</strong>
              <p style="color:var(--text-secondary);font-size:14px;margin-top:4px;">${l.practices[currentPracticeIndex]?.desc || ''}</p>
              <div style="margin-top:6px;">
                <span class="badge ${levelClass[l.practices[currentPracticeIndex]?.level] || 'badge-easy'}">
                  ${l.practices[currentPracticeIndex]?.level || 'Dễ'}
                </span>
              </div>
            </div>
          `;
            loadPracticeEditor(currentDay, currentPracticeIndex);
        }

        function selectPractice(idx) {
            currentPracticeIndex = idx;
            renderPracticeExercises();
        }

        function loadPracticeEditor(day, idx) {
            const l = LESSONS.find(x => x.day === day);
            if (!l || !l.practices || idx >= l.practices.length) return;
            const saved = JSON.parse(localStorage.getItem(userKey('practice_' + day + '_' + idx)) || 'null');
            const defaultHtml = getPracticeHtml(day, idx);
            const defaultCss = getPracticeCss(day, idx);
            if (saved) {
                document.getElementById('htmlEditor').value = saved.html || defaultHtml;
                document.getElementById('cssEditor').value = saved.css || defaultCss;
            } else {
                document.getElementById('htmlEditor').value = defaultHtml;
                document.getElementById('cssEditor').value = defaultCss;
            }
            document.getElementById('practiceTitle').textContent = `Ngày ${day}: ${l.practices[idx].title}`;
            runCode();
            setupAutoSave();
        }

        function runCode() {
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            const frame = document.getElementById('previewFrame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(`<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}</body></html>`);
            doc.close();
        }

        function resetPractice() {
            const d = currentDay;
            const idx = currentPracticeIndex;
            const defaultHtml = getPracticeHtml(d, idx);
            const defaultCss = getPracticeCss(d, idx);
            document.getElementById('htmlEditor').value = defaultHtml;
            document.getElementById('cssEditor').value = defaultCss;
            runCode();
            localStorage.removeItem(userKey('practice_' + d + '_' + idx));
            showToast('Đã reset về mặc định', 'info');
        }

        function clearPractice() {
            document.getElementById('htmlEditor').value = '';
            document.getElementById('cssEditor').value = '';
            runCode();
            showToast('Đã xóa code', 'info');
        }

        function submitPractice() {
            const d = currentDay;
            const idx = currentPracticeIndex;
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            if (!html.trim()) {
                showToast('Vui lòng viết code trước khi nộp!', 'warning');
                return;
            }
            localStorage.setItem(userKey('practice_' + d + '_' + idx), JSON.stringify({ html, css }));
            // Mark progress
            const progressKey = userKey('progress');
            const progress = JSON.parse(localStorage.getItem(progressKey) || '{}');
            progress[d] = true;
            localStorage.setItem(progressKey, JSON.stringify(progress));
            showToast(`✅ Đã nộp bài thực hành ngày ${d}!`, 'success');
        }

        function setupAutoSave() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(() => {
                const d = currentDay;
                const idx = currentPracticeIndex;
                const html = document.getElementById('htmlEditor').value;
                const css = document.getElementById('cssEditor').value;
                if (html.trim() || css.trim()) {
                    localStorage.setItem(userKey('practice_' + d + '_' + idx), JSON.stringify({ html, css }));
                }
            }, 10000);
        }

        function debounce(fn, delay) {
            let t;
            return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
        }

        // ============================================================
        function toggleAIChat() {
            const panel = document.getElementById('aiChatPanel');
            panel.classList.toggle('open');
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            const messages = document.getElementById('aiMessages');
            messages.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
            messages.scrollTop = messages.scrollHeight;
            
            setTimeout(() => {
                const response = generateAIResponse(msg);
                messages.innerHTML += `<div class="msg ai">${response}</div>`;
                messages.scrollTop = messages.scrollHeight;
            }, 300 + Math.random() * 400);
        }

        function generateAIResponse(query) {
            const q = query.toLowerCase();
            if (q.includes('html') && (q.includes('cấu trúc') || q.includes('cơ bản'))) {
                return 'HTML (HyperText Markup Language) là ngôn ngữ đánh dấu dùng để tạo cấu trúc trang web. Cấu trúc cơ bản: <code>&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;title&gt;...&lt;/title&gt;&lt;/head&gt;&lt;body&gt;...&lt;/body&gt;&lt;/html&gt;</code>';
            }
            if (q.includes('css') && (q.includes('flexbox') || q.includes('layout'))) {
                return 'Flexbox là một công cụ layout mạnh mẽ trong CSS. Các thuộc tính chính: <br>• <strong>display: flex</strong> - tạo container flex<br>• <strong>justify-content</strong> - căn chỉnh theo trục chính<br>• <strong>align-items</strong> - căn chỉnh theo trục phụ<br>• <strong>gap</strong> - khoảng cách giữa các item<br>• <strong>flex-wrap</strong> - cho phép xuống dòng';
            }
            if (q.includes('form') || q.includes('biểu mẫu')) {
                return 'Biểu mẫu (form) trong HTML dùng để thu thập dữ liệu người dùng. Các thành phần chính: <br>• <strong>&lt;form&gt;</strong> - bao bọc các input<br>• <strong>&lt;input type="text"&gt;</strong> - nhập văn bản<br>• <strong>&lt;input type="email"&gt;</strong> - nhập email<br>• <strong>&lt;input type="password"&gt;</strong> - nhập mật khẩu<br>• <strong>&lt;input type="checkbox"&gt;</strong> - chọn nhiều<br>• <strong>&lt;input type="radio"&gt;</strong> - chọn một<br>• <strong>&lt;button type="submit"&gt;</strong> - nút gửi';
            }
            if (q.includes('semantic')) {
                return 'Thẻ semantic trong HTML giúp mô tả ý nghĩa nội dung, hỗ trợ SEO và accessibility. Các thẻ phổ biến: <br>• <strong>&lt;header&gt;</strong> - đầu trang<br>• <strong>&lt;nav&gt;</strong> - điều hướng<br>• <strong>&lt;main&gt;</strong> - nội dung chính<br>• <strong>&lt;section&gt;</strong> - nhóm nội dung<br>• <strong>&lt;article&gt;</strong> - bài viết độc lập<br>• <strong>&lt;aside&gt;</strong> - nội dung phụ<br>• <strong>&lt;footer&gt;</strong> - chân trang';
            }
            if (q.includes('responsive')) {
                return 'Responsive là kỹ thuật giúp website hiển thị tốt trên mọi thiết bị. Cách thực hiện: <br>• Sử dụng <strong>@media</strong> queries<br>• Sử dụng <strong>flexbox</strong> và <strong>grid</strong><br>• Sử dụng đơn vị <strong>%, em, rem</strong> thay vì px<br>• Sử dụng <strong>max-width: 100%</strong> cho ảnh';
            }
            if (q.includes('selector') || q.includes('class') || q.includes('id')) {
                return 'CSS Selector dùng để chọn phần tử cần style: <br>• <strong>Tag selector</strong>: <code>h1 { }</code><br>• <strong>Class selector</strong>: <code>.ten-class { }</code><br>• <strong>ID selector</strong>: <code>#ten-id { }</code><br>• <strong>Descendant</strong>: <code>div p { }</code><br>• <strong>Child</strong>: <code>div > p { }</code>';
            }
            if (q.includes('bài tập') || q.includes('practice') || q.includes('thực hành')) {
                return 'Bạn đang ở trang thực hành. Mỗi ngày học có các bài tập với các cấp độ khác nhau (Dễ, Trung bình, Khó). Hãy chọn một bài tập, viết code HTML và CSS, sau đó nhấn "Chạy" để xem kết quả. Bạn có thể nộp bài để lưu tiến độ!';
            }
            if (q.includes('lỗi') || q.includes('error') || q.includes('bug')) {
                return 'Đừng lo lắng! Lỗi là một phần của quá trình học. Hãy kiểm tra lại:<br>• HTML có đóng thẻ đúng không?<br>• CSS có thiếu dấu {} hoặc ; không?<br>• Có lỗi chính tả trong thuộc tính không?<br>Nếu vẫn gặp vấn đề, hãy gửi mã của bạn để tôi giúp kiểm tra!';
            }
            if (q.includes('cảm ơn') || q.includes('thank')) {
                return 'Không có gì! Tôi luôn sẵn sàng giúp đỡ bạn. Nếu có bất kỳ câu hỏi nào khác, đừng ngần ngại hỏi nhé! 😊';
            }
            // Default response with helpful tips
            const tips = [
                'Hãy thử sử dụng Flexbox để căn chỉnh các phần tử dễ dàng hơn.',
                'Đừng quên thêm thuộc tính alt cho ảnh để tốt cho SEO và accessibility.',
                'Sử dụng semantic HTML (header, nav, main, section, article, footer) để cấu trúc trang rõ ràng hơn.',
                'Thực hành nhiều sẽ giúp bạn nhớ lâu hơn! Hãy thử viết lại code từ đầu.',
                'Bạn có thể sử dụng CSS để tạo màu sắc, font chữ và bố cục đẹp mắt.'
            ];
            return tips[Math.floor(Math.random() * tips.length)];
        }

        // ============================================================
        // INIT
        // ============================================================
        loadState();
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            document.getElementById('themeIcon').className = 'fas fa-sun';
        }

        if (isLoggedIn()) {
            document.getElementById('userName').textContent = currentUser.name || 'Học viên';
            document.getElementById('userAvatar').textContent = currentUser.avatar || currentUser.name.charAt(0).toUpperCase();
        } else {
            window.location.href = 'login.html';
        }

        // Load practice
        const urlParams = new URLSearchParams(window.location.search);
        const dayParam = urlParams.get('day');
        if (dayParam) {
            currentDay = parseInt(dayParam) || 1;
        } else {
            const savedDay = localStorage.getItem('currentDay');
            if (savedDay) currentDay = parseInt(savedDay) || 1;
        }
        renderPracticeExercises();

        // Event listeners
        document.getElementById('htmlEditor').addEventListener('input', debounce(runCode, 400));
        document.getElementById('cssEditor').addEventListener('input', debounce(runCode, 400));

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'htmlEditor' || active.id === 'cssEditor')) {
                    e.preventDefault();
                    runCode();
                    showToast('Đã chạy code!', 'success');
                }
            }
        });

        // Back to top
        document.addEventListener('scroll', () => {
            const btn = document.getElementById('backTop');
            if (window.scrollY > 400) btn.classList.add('visible');
            else btn.classList.remove('visible');
        });

        console.log('🚀 Trang thực hành HTML + CSS Pro');
        console.log('📚', LESSONS.length, 'ngày học');
        console.log('💻 Tổng bài thực hành:', LESSONS.reduce((s, l) => s + (l.practices ? l.practices.length : 0), 0));
        console.log('👤', isLoggedIn() ? currentUser.email : 'Chưa đăng nhập');
        console.log('💡 Ctrl+Enter để chạy code');
    </script>
</body>
</html>
